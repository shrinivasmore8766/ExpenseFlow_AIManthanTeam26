server:
  port: 8080
  error:
    include-stacktrace: never

spring:
  application:
    name: expenseflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenseflow}
    username: ${DB_USER:expenseflow}
    # Local-dev default only; Docker Compose and real deployments pass DB_PASSWORD from .env
    password: ${DB_PASSWORD:expenseflow}
  jpa:
    hibernate:
      ddl-auto: update        # deliberate 3-hour trade-off (see docs/architecture/04); Flyway is the next step
    open-in-view: false       # map entities to DTOs inside @Transactional services
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
        order_inserts: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    demo-password: ${APP_DEMO_PASSWORD:Demo@123}
  receipts:
    dir: ${APP_RECEIPTS_DIR:./data/receipts}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
